name: profile

# Rebuilds the live images every day: the activity card and the contribution snake.
# They are pushed to the `output` branch, which the README reads from.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Activity card
        run: python3 .github/scripts/stats.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_LOGIN: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#be185d&color_dots=#ebedf0,#fde68a,#f59e0b,#f472b6,#be185d
            dist/snake-dark.svg?color_snake=#fbbf24&color_dots=#161b22,#78350f,#b45309,#db2777,#f472b6

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update activity card and snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
